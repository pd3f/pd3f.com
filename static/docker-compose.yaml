services:
  web:
    image: pd3f/pd3f:latest
    ports:
      - "1616:5000"
    depends_on:
      - redis
    environment:
      RQ_REDIS_URL: redis://redis:6379
    volumes:
      - ./pd3f-data-uploads/:/uploads/
    command: gunicorn app:app --workers=1 --bind=0.0.0.0:5000

  parsr:
    image: axarev/parsr:v1.2.2
    # only published for amd64, runs emulated on ARM hosts
    platform: linux/amd64
    expose:
      - 3001

  redis:
    image: redis:8-alpine
    expose:
      - 6379

  worker:
    image: pd3f/pd3f:latest
    depends_on:
      - parsr
      - redis
    volumes:
      - ./pd3f-data-uploads/:/uploads/
      - ./pd3f-data-to-ocr/:/to-ocr/
      - ./pd3f-data-cache/:/root/.cache/
    environment:
      RQ_REDIS_URL: redis://redis:6379
      # delete results / files after one day
      KEEP_RESULTS_HOURS: 24
    command: rq worker --with-scheduler --results-ttl 86400

  ocr_worker:
    image: pd3f/pd3f-ocr:latest
    volumes:
      - ./pd3f-data-to-ocr/:/to-ocr/
