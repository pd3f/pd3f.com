services:
  pd3f:
    image: pd3f/pd3f:1.0
    # only on this computer: the web app has no authentication
    ports:
      - "127.0.0.1:8000:8000"
    # jobs and the language models of the Flair scorers
    volumes:
      - ./pd3f-data/:/data/
    environment:
      # PDFs extracted at the same time, hours a job is kept
      PD3F_WORKERS: 2
      PD3F_JOB_TTL: 24
